<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffd6e7" />
  <title>mumu - Language Learning</title>
  <link rel="stylesheet" href="css/styles.css?v=1.3.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/mumu.jpg" />
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="logo-btn" data-nav="home" aria-label="Home">
          <img class="logo-mascot" src="assets/mumu.jpg" alt="mumu" />
          <span class="logo-text">mumu</span>
        </button>
        <button class="lang-switcher" id="lang-switcher" aria-label="Switch language">
          <span class="lang-flag" id="lang-flag">🇯🇵</span>
          <span class="lang-name" id="lang-name">Japanese</span>
          <span class="lang-chevron">▾</span>
        </button>
        <div class="stats">
          <div class="stat-chip" title="Daily streak">
            <span class="chip-icon">🔥</span>
            <span class="chip-value" id="stat-streak">0</span>
          </div>
          <div class="stat-chip" title="Experience points">
            <span class="chip-icon">⭐</span>
            <span class="chip-value" id="stat-xp">0</span>
          </div>
          <div class="stat-chip" title="Cards due for review">
            <span class="chip-icon">📚</span>
            <span class="chip-value" id="stat-due">0</span>
          </div>
        </div>
      </div>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-btn active" data-nav="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Learn</span>
      </button>
      <button class="nav-btn" data-nav="review">
        <span class="nav-icon">🔄</span>
        <span class="nav-label">Review</span>
        <span class="nav-badge hidden" id="nav-due-badge">0</span>
      </button>
      <button class="nav-btn" data-nav="browse">
        <span class="nav-icon">📖</span>
        <span class="nav-label">Browse</span>
      </button>
      <button class="nav-btn" data-nav="profile">
        <span class="nav-icon">🧸</span>
        <span class="nav-label">Me</span>
      </button>
    </nav>

    <div class="toast-container" id="toast-container"></div>
    <div class="confetti-container" id="confetti-container"></div>
    <div class="modal-backdrop hidden" id="modal-backdrop"></div>
    <div class="version-tag" id="version-tag" title="App version (developer info)">v1.3.0 · 2026-05-10</div>
  </div>

  <!-- data: per-language content -->
  <script src="js/data/languages.js?v=1.3.0"></script>
  <script src="js/data/emoji.js?v=1.3.0"></script>
  <script src="js/data/ja.js?v=1.3.0"></script>
  <script src="js/data/ko.js?v=1.3.0"></script>
  <script src="js/data/en.js?v=1.3.0"></script>
  <script src="js/data/es.js?v=1.3.0"></script>

  <!-- core -->
  <script src="js/storage.js?v=1.3.0"></script>
  <script src="js/audio.js?v=1.3.0"></script>
  <script src="js/srs.js?v=1.3.0"></script>
  <script src="js/ui.js?v=1.3.0"></script>
  <script src="js/exercises.js?v=1.3.0"></script>
  <script src="js/views.js?v=1.3.0"></script>

  <!-- Firebase (loaded as module so it can use ESM) -->
  <script type="module" src="js/sync.js?v=1.3.0"></script>

  <script src="js/app.js?v=1.3.0"></script>
</body>
</html>
